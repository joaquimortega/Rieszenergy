version: v0.4
project:
  name: 'Deterministic Diamond points: Riesz energy and discrepancy'
  description: Lean formalization of the distance-power energy bound for deterministic Diamond points
    on S², optimal L² cap discrepancy, and genuine L² Sobolev quadrature bounds with universal optimality.
    All 104 active modules build. Continuous representatives and intrinsic weak Laplacian eigenspaces
    are identified explicitly; full strict standalone comparator verification passed.
  authors:
  - Codex, under instructions from Joaquim Ortega-Cerdà
  license: 'Unspecified: no repository license grant has been supplied.'
sources:
- title: A set of points with optimal L² spherical cap discrepancy
  authors:
  - Carlos Beltrán
  - Jordi Marzo
  - Joaquim Ortega-Cerdà
  id: definitive.tex (repository source snapshot)
  type: article
  location: thm:main; cor:main; cor:wce; appendices 1 and 2
  relationship: formalizes
  note: The user supplied this manuscript. The source is preserved; corrections and clarifications are
    recorded in NOTEBOOK.md.
- title: 'QMC designs: optimal order Quasi Monte Carlo integration schemes on the sphere'
  authors:
  - Johann S. Brauchart
  - Edward B. Saff
  - Ian H. Sloan
  - Robert S. Womersley
  id: https://arxiv.org/abs/1208.3267
  type: article
  location: Section 5, equations (38)–(42); Theorem 3
  relationship: background
  note: Background for the spectral/distance-kernel comparison and optimal Sobolev rate. The formalization
    proves its harmonic basis, addition formula, exact coefficients, embedding, comparison and universal
    lower bound; no external result is imported as an axiom.
- title: On the lower bounds for the spherical cap discrepancy
  authors:
  - Dmitriy Bilyk
  - Johann S. Brauchart
  id: https://arxiv.org/abs/2502.15984
  type: article
  location: Section 2
  relationship: background
  note: Elementary positive-binomial and projection-moment route used in the checked Beck lower proof;
    no external result is assumed as an axiom.
