    lean: main_theorem_target
    module: BEMOCFormalization/MainTheorem.lean
    status: proved
    note: All analytic premises are discharged; phase-uniform for every N≥4.
  - source: cor:main
    lean: cap_corollary
    module: BEMOCFormalization/Corollaries.lean
